name: Report a problem
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities do not go here.** Use the private channel
        described in [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: And what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Open the Settings tab
        2. Move the saturation slider to 130
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Zdisplay version
      description: The first line of `zdisplay.exe --status`.
      placeholder: "1.0.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2 (26100)"
    validations:
      required: true

  - type: textarea
    id: diag
    attributes:
      label: Output of --diag
      description: >
        Paste the output of `zdisplay.exe --diag`. It lists, per monitor, which
        backend handles what and the reason when a control is unavailable. For a
        monitor, GPU or brightness problem, this is the information that
        resolves the report.
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Monitor make and model, if the problem is hardware related. Is HDR on?
        Is Windows Night light on? Is another color tool running alongside?
    validations:
      required: false
