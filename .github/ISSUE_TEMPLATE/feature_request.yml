name: Sugerir uma mudança
description: Uma função nova ou uma melhoria em algo que já existe
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Que problema isso resolve
      description: >
        Descreva a situação real, não a solução. O que você estava tentando
        fazer quando sentiu falta disso?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: O que você propõe
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: O que você já tentou
      description: Outro ajuste, outro programa, outro caminho.
    validations:
      required: false
