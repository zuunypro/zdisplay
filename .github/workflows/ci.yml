name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            make

      - name: Build and run the test suite
        shell: msys2 {0}
        run: make check

      - name: Verify binary hardening
        shell: msys2 {0}
        run: |
          for flag in NX_COMPAT DYNAMIC_BASE HIGH_ENTROPY_VA; do
            objdump -x build/release/zdisplay.exe | grep -q "$flag" \
              || { echo "$flag is not set on the binary"; exit 1; }
          done
          echo 'DEP, ASLR and high-entropy ASLR are all set.'

      - name: Report binary size and hash
        shell: msys2 {0}
        run: |
          ls -l build/release/zdisplay.exe
          sha256sum build/release/zdisplay.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: zdisplay-${{ github.sha }}
          path: build/release/zdisplay.exe
          if-no-files-found: error
