name: CodeQL

# Static analysis for the paths that handle data the program does not control:
# EDID blocks and MCCS capability strings arriving over I2C from monitor
# firmware, the configuration file, and the saved display state.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Queries are updated after code is written, so a weekly run finds problems
    # a push-triggered scan would never revisit.
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C++
    runs-on: windows-latest
    permissions:
      security-events: write   # publish alerts to the Security tab
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            make

      - name: Initialize CodeQL
        uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      # CodeQL analyses what it watches being compiled, so a real build has to
      # run underneath it. `make check` is used rather than `make`, so the test
      # sources are covered as well.
      - name: Build for analysis
        shell: msys2 {0}
        run: make check

      - name: Analyze
        uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # v3
        with:
          category: /language:c-cpp
